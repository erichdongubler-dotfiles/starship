add_newline = true

[directory]
truncation_symbol = "…/"

[git_branch]
symbol = "\ue702 " # Nerdfont 3.0: nf-md-git

[git_status]
disabled = true

[gradle]
symbol = "\ue660 " # Nerdfont 3.0: nf-seti-gradle

[hg_branch]
disabled = false
truncation_symbol = "…"

[java]
symbol = "\ue738 " # Nerdfont 3.0: nf-dev-java

[python]
symbol = "\ue73c " # Nerdfont 3.0: nf-dev-python

[rust]
symbol = "\ue7a8 " # Nerdfont 3.0: nf-dev-rust

[custom.jj]
when = "jj root"
symbol = "🐦 "
command = """
(
	jj log
		--no-graph
		--revisions 'coalesce(
			heads(::@ & bookmarks()),
			heads(@- | present(@ ~ (empty() | description(exact:""))))
		)'
		--template 'coalesce(
			bookmarks.join(" ") ++ " ",
			change_id.shortest(),
		)'
)
(
	jj log
		--revisions @
		--no-graph
		--ignore-working-copy
		--template 'truncate_end(
			15,
			concat(
				if(conflict, "="),
				if(self.diff().files().filter(|f| f.status() == "removed"), "✘"),
				if(self.diff().files().filter(|f| f.status() == "renamed"), "»"),
				if(self.diff().files().filter(|f| f.status() == "modified"), "!"),
				if(self.diff().files().filter(|f| f.status() == "added"), "?"),
				if(!description, " "),
				if(divergent, "⇕"),
				if(immutable, " "),
			),
			"..",
		)'
)
"""
detect_folders = [".jj"]
shell = ["nu", "--commands"]
use_stdin = false
