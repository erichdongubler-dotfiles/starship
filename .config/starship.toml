[custom.jj_bookmark_heads]
symbol = "🐦 "
command = """
(
	jj log
		--no-graph
		--revisions 'coalesce(
			heads(::@ & bookmarks()),
			heads(@- | present(@ ~ (empty() | description(exact:""))))
		)'
		--template 'coalesce(
			bookmarks.join(" ") ++ " ",
			change_id.shortest(),
		)'
)
"""
shell = ["nu", "--commands"]
use_stdin = false

[directory]
truncation_symbol = "…/"

[git_branch]
symbol = "\ue702 "  # Nerdfont 3.0: nf-md-git

[git_status]
disabled = true

[gradle]
symbol = "\ue660 "  # Nerdfont 3.0: nf-seti-gradle

[hg_branch]
disabled = false
truncation_symbol = "…"

[java]
symbol = "\ue738 "  # Nerdfont 3.0: nf-dev-java

[jj_bookmark]
truncation_length = 128

[jj_status]
description_empty = ""
description_present = ":"

[python]
symbol = "\ue73c "  # Nerdfont 3.0: nf-dev-python

[rust]
symbol = "\ue7a8 "  # Nerdfont 3.0: nf-dev-rust

[vcs]
order = ["jj", "git", "hg", "pijul", "fossil"]
jj_modules = "$jj_bookmark$jj_change$jj_metrics$jj_status"
